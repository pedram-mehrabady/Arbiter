name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify CLI is runnable
        run: node dist/cli/index.js --version

      - name: Create temp workspace
        run: mkdir -p /tmp/arbiter-smoke && cd /tmp/arbiter-smoke && echo '{"project":"smoke-test","stack":{}}' > arbiter.config.json

      - name: Verify arbiter/ folder pattern
        run: test -f /tmp/arbiter-smoke/arbiter.config.json && echo "OK: arbiter.config.json present"

  dashboard-typecheck:
    name: Dashboard Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dashboard dependencies
        run: npm ci
        working-directory: dashboard

      - name: Typecheck dashboard
        run: npx tsc --noEmit
        working-directory: dashboard
